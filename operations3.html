<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SME Finance Operations</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#0b3d2e;color:#fff;padding:18px 24px}main{max-width:1000px;margin:30px auto;padding:0 16px}.card{background:#fff;border:1px solid #e1e6ef;border-radius:14px;padding:24px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #cbd3df;border-radius:9px;box-sizing:border-box;font-size:16px}button{padding:12px 18px;border:0;border-radius:9px;background:#0b3d2e;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:14px;padding:12px;border-radius:8px}.muted{color:#667085}.error{background:#fff0ef;color:#b42318}.success{background:#ecfdf3;color:#067647}.hidden{display:none}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:15px}.metric{font-size:22px;font-weight:800;margin-top:5px}</style></head><body><header><strong>SME Finance Operations</strong></header><main><section id="login" class="card"><h1>Sign in</h1><p class="muted">This version uses Supabase's authentication API directly, without the external JavaScript library.</p><div class="grid"><div><label>Email</label><input id="email" type="email" autocomplete="email"></div><div><label>Password</label><input id="password" type="password" autocomplete="current-password"></div></div><p><button id="btn">Sign in</button></p><div id="msg"></div></section><section id="app" class="hidden"><div class="card"><h1>Operational workspace</h1><p>Signed in as <strong id="who"></strong></p><div id="status" class="msg muted">Loading client data…</div></div><div class="card"><h2>Financial control dashboard</h2><div id="dash" class="summary"></div></div><button id="out">Sign out</button></section></main><script>const BASE='https://adqyigwnotfvboblmlyr.supabase.co';const KEY='sb_publishable_nSh-mNWE6erSAfRsS7-IHA_Zgjk-xmA';const API=BASE+'/functions/v1/diagnostic-api-v2';const $=x=>document.getElementById(x);function message(t,c='muted'){ $('msg').className='msg '+c;$('msg').textContent=t }async function signIn(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){message('Enter your email and password.','error');return}$('btn').disabled=true;message('Signing in…');try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||j.error||'Supabase sign-in failed');if(!j.access_token)throw new Error('Supabase returned no access token.');sessionStorage.setItem('sme_access_token',j.access_token);sessionStorage.setItem('sme_refresh_token',j.refresh_token||'');sessionStorage.setItem('sme_email',j.user?.email||email);await openApp(j.access_token,j.user?.email||email)}catch(e){console.error(e);message(e.message,'error')}finally{$('btn').disabled=false}}async function api(path,token){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token,apikey:KEY}});const text=await r.text();let j={};try{j=JSON.parse(text)}catch{}if(!r.ok)throw new Error(j.error||j.message||'API request failed ('+r.status+')');return j}async function openApp(token,email){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=email;try{const j=await api('/clients',token);const clients=j.clients||[];if(!clients.length){$('status').className='msg success';$('status').textContent='Authentication succeeded. No SME client is assigned to this account yet.';return}const id=clients[0].id;const d=await api('/dashboard?client_id='+encodeURIComponent(id),token);const a=d.ar||{},p=d.ap||{},c=d.cashflow||{};$('dash').innerHTML='<div class="box"><small>AR outstanding</small><div class="metric">₹'+Number(a.outstanding||0).toLocaleString('en-IN')+'</div></div><div class="box"><small>AP outstanding</small><div class="metric">₹'+Number(p.outstanding||0).toLocaleString('en-IN')+'</div></div><div class="box"><small>Receipts</small><div class="metric">₹'+Number(c.receipts||0).toLocaleString('en-IN')+'</div></div><div class="box"><small>Payments</small><div class="metric">₹'+Number(c.payments||0).toLocaleString('en-IN')+'</div></div>';$('status').className='msg success';$('status').textContent='Authentication and operations API are working.'}catch(e){$('status').className='msg error';$('status').textContent=e.message}}$('btn').addEventListener('click',signIn);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});$('out').addEventListener('click',()=>{sessionStorage.clear();location.reload()});const tok=sessionStorage.getItem('sme_access_token');if(tok)openApp(tok,sessionStorage.getItem('sme_email')||'signed-in user');</script></body></html>
