<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SME Finance Operations</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#0b3d2e;color:#fff;padding:18px 24px}header .bar{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}main{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #e1e6ef;border-radius:14px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:15px}.metric{font-size:22px;font-weight:800;margin-top:5px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #cbd3df;border-radius:9px;font-size:15px;background:#fff}button{padding:11px 15px;border:0;border-radius:9px;background:#0b3d2e;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e9eef5;color:#172033}button.danger{background:#b42318}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{background:#e9eef5;color:#172033}.tab.active{background:#0b3d2e;color:#fff}.hidden{display:none}.muted{color:#667085}.msg{padding:11px;border-radius:8px;margin-top:12px}.error{background:#fff0ef;color:#b42318}.success{background:#ecfdf3;color:#067647}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}th{font-size:12px;text-transform:uppercase;color:#667085}.table-wrap{overflow:auto}.module-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.small{font-size:12px}@media(max-width:700px){header{padding:14px 16px}.card{padding:16px}}
</style>
</head>
<body>
<header><div class="bar"><strong>SME Finance Operations</strong><button id="out" class="secondary">Sign out</button></div></header>
<main>
<section id="login" class="card">
<h1>Sign in</h1><p class="muted">Finance operations workspace connected to Supabase.</p>
<div class="grid"><div><label>Email</label><input id="email" type="email" autocomplete="email"></div><div><label>Password</label><input id="password" type="password" autocomplete="current-password"></div></div>
<p><button id="loginBtn">Sign in</button></p><div id="loginMsg"></div>
</section>
<section id="app" class="hidden">
<div class="card"><div class="module-head"><div><h1>Operational workspace</h1><p>Signed in as <strong id="who"></strong></p></div><div><label>SME client</label><select id="clientSelect"></select></div></div><div id="status" class="msg muted">Loading…</div></div>
<div class="card"><h2>Financial control dashboard</h2><div id="dash" class="summary"></div></div>
<div class="card">
<div class="tabs">
<button class="tab active" data-module="customers">Customers</button><button class="tab" data-module="vendors">Vendors</button><button class="tab" data-module="invoices">Invoices / AR</button><button class="tab" data-module="bills">Bills / AP</button><button class="tab" data-module="receipts">Receipts</button><button class="tab" data-module="payments">Payments</button><button class="tab" data-module="bank-accounts">Bank accounts</button><button class="tab" data-module="bank-transactions">Bank transactions</button>
</div>
<div id="module"></div>
</div>
</section>
</main>
<script>
const BASE='https://adqyigwnotfvboblmlyr.supabase.co';
const KEY='sb_publishable_nSh-mNWE6erSAfRsS7-IHA_Zgjk-xmA';
const API=BASE+'/functions/v1/diagnostic-api-v2';
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('sme_access_token')||'',email=sessionStorage.getItem('sme_email')||'',clients=[],clientId='',module='customers';
function msg(id,text,type='muted'){const e=$(id);e.className='msg '+type;e.textContent=text}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return '₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
async function login(){const e=$('email').value.trim(),p=$('password').value;if(!e||!p){msg('loginMsg','Enter your email and password.','error');return}$('loginBtn').disabled=true;msg('loginMsg','Signing in…');try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email:e,password:p})});const j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||j.error||'Supabase sign-in failed');token=j.access_token;email=j.user?.email||e;sessionStorage.setItem('sme_access_token',token);sessionStorage.setItem('sme_refresh_token',j.refresh_token||'');sessionStorage.setItem('sme_email',email);await openApp()}catch(e){console.error(e);msg('loginMsg',e.message,'error')}finally{$('loginBtn').disabled=false}}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':KEY,...(opt.headers||{})}});const text=await r.text();let j={};try{j=JSON.parse(text)}catch{}if(!r.ok)throw Error(j.error||j.message||'API request failed ('+r.status+')');return j}
async function openApp(){if(!token)return;try{const j=await api('/clients');clients=j.clients||[];$('who').textContent=email;$('clientSelect').innerHTML=clients.map(c=>`<option value="${esc(c.id)}">${esc(c.business_name)}</option>`).join('');if(!clients.length){$('status').textContent='No SME client exists for this account. Create one from the diagnostic workspace first.';msg('status','No SME client exists for this account.','error');return}clientId=clients[0].id;showApp();await refresh()}catch(e){console.error(e);msg('loginMsg',e.message,'error')}}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}
async function refresh(){await loadDashboard();await loadModule()}
async function loadDashboard(){try{const d=await api('/dashboard?client_id='+encodeURIComponent(clientId));$('dash').innerHTML=`<div class="box"><small>AR outstanding</small><div class="metric">${money(d.ar?.outstanding)}</div><small>${d.ar?.overdue?money(d.ar.overdue)+' overdue':''}</small></div><div class="box"><small>AP outstanding</small><div class="metric">${money(d.ap?.outstanding)}</div><small>${d.ap?.overdue?money(d.ap.overdue)+' overdue':''}</small></div><div class="box"><small>Receipts</small><div class="metric">${money(d.cashflow?.receipts)}</div></div><div class="box"><small>Payments</small><div class="metric">${money(d.cashflow?.payments)}</div></div><div class="box"><small>Bank credits</small><div class="metric">${money(d.cashflow?.bank_credits)}</div></div><div class="box"><small>Bank debits</small><div class="metric">${money(d.cashflow?.bank_debits)}</div></div>`;msg('status','Operations API connected and dashboard refreshed.','success')}catch(e){msg('status',e.message,'error')}}
const defs={
customers:{title:'Customers',fields:[['customer_code','Customer code'],['name','Name'],['email','Email'],['phone','Phone'],['tax_id','Tax ID'],['credit_limit','Credit limit'],['payment_terms_days','Payment terms (days)'],['active','Active']],cols:['customer_code','name','email','phone','credit_limit','payment_terms_days','active']},
vendors:{title:'Vendors',fields:[['vendor_code','Vendor code'],['name','Name'],['email','Email'],['phone','Phone'],['tax_id','Tax ID'],['payment_terms_days','Payment terms (days)'],['active','Active']],cols:['vendor_code','name','email','phone','payment_terms_days','active']},
invoices:{title:'Invoices / Accounts Receivable',fields:[['customer_id','Customer ID'],['invoice_number','Invoice number'],['invoice_date','Invoice date','date'],['due_date','Due date','date'],['currency','Currency'],['subtotal','Subtotal','number'],['tax_amount','Tax amount','number'],['total_amount','Total amount','number'],['amount_paid','Amount paid','number'],['status','Status']],cols:['invoice_number','customer_id','invoice_date','due_date','total_amount','amount_paid','status']},
bills:{title:'Bills / Accounts Payable',fields:[['vendor_id','Vendor ID'],['bill_number','Bill number'],['bill_date','Bill date','date'],['due_date','Due date','date'],['currency','Currency'],['subtotal','Subtotal','number'],['tax_amount','Tax amount','number'],['total_amount','Total amount','number'],['amount_paid','Amount paid','number'],['status','Status']],cols:['bill_number','vendor_id','bill_date','due_date','total_amount','amount_paid','status']},
receipts:{title:'Receipts',fields:[['customer_id','Customer ID'],['receipt_number','Receipt number'],['receipt_date','Receipt date','date'],['amount','Amount','number'],['currency','Currency'],['payment_method','Payment method'],['reference','Reference'],['status','Status']],cols:['receipt_number','customer_id','receipt_date','amount','payment_method','reference','status']},
payments:{title:'Payments',fields:[['vendor_id','Vendor ID'],['payment_number','Payment number'],['payment_date','Payment date','date'],['amount','Amount','number'],['currency','Currency'],['payment_method','Payment method'],['reference','Reference'],['status','Status']],cols:['payment_number','vendor_id','payment_date','amount','payment_method','reference','status']},
'bank-accounts':{title:'Bank accounts',fields:[['account_name','Account name'],['bank_name','Bank name'],['account_mask','Account last 4'],['currency','Currency'],['opening_balance','Opening balance','number'],['active','Active']],cols:['account_name','bank_name','account_mask','currency','opening_balance','active']},
'bank-transactions':{title:'Bank transactions',fields:[['bank_account_id','Bank account ID'],['transaction_date','Transaction date','date'],['value_date','Value date','date'],['description','Description'],['reference','Reference'],['debit','Debit','number'],['credit','Credit','number'],['balance','Balance','number'],['external_id','External ID'],['reconciliation_status','Reconciliation status']],cols:['transaction_date','description','reference','debit','credit','balance','reconciliation_status']}
};
function formField(f){return `<div><label>${esc(f[1])}</label><input id="f_${esc(f[0])}" type="${f[2]||'text'}" ${f[2]==='number'?'step="any"':''}></div>`}
function moduleHtml(rows){const d=defs[module];return `<div class="module-head"><div><h2>${d.title}</h2><p class="muted small">Client: ${esc(clients.find(x=>x.id===clientId)?.business_name||'')}</p></div><button id="toggleForm">+ Add ${d.title.replace(' / Accounts Receivable','').replace(' / Accounts Payable','').replace('Bank ','Bank ')}</button></div><div id="addForm" class="card hidden"><div class="grid">${d.fields.map(formField).join('')}</div><p><button id="saveRecord">Save</button> <button id="cancelForm" class="secondary">Cancel</button></p><div id="formMsg"></div></div><div class="table-wrap"><table><thead><tr>${d.cols.map(c=>`<th>${esc(c.replaceAll('_',' '))}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${d.cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${d.cols.length}">No records yet.</td></tr>`}</tbody></table></div>`}
async function loadModule(){try{const j=await api('/'+module+'?client_id='+encodeURIComponent(clientId));const key=module.replaceAll('-','_');const rows=j[key]||[];$('module').innerHTML=moduleHtml(rows);$('toggleForm').onclick=()=>{$('addForm').classList.remove('hidden')};$('cancelForm').onclick=()=>{$('addForm').classList.add('hidden')};$('saveRecord').onclick=saveRecord}catch(e){$('module').innerHTML=`<div class="error msg">${esc(e.message)}</div>`}}
async function saveRecord(){const d=defs[module],body={client_id:clientId};for(const f of d.fields){const v=$('f_'+f[0]).value.trim();if(v!=='')body[f[0]]=f[2]==='number'?Number(v):v}try{$('saveRecord').disabled=true;const j=await api('/'+module,{method:'POST',body:JSON.stringify(body)});msg('status','Record saved successfully.','success');await refresh()}catch(e){msg('formMsg',e.message,'error')}finally{$('saveRecord').disabled=false}}
$('loginBtn').addEventListener('click',login);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('out').addEventListener('click',()=>{sessionStorage.clear();location.reload()});$('clientSelect').addEventListener('change',async e=>{clientId=e.target.value;await refresh()});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',async()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');module=b.dataset.module;await loadModule()}));if(token)openApp();
</script>
</body>
</html>
