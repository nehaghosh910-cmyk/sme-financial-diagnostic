<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SME Financial Health Diagnostic</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#0b3d2e;color:#fff;padding:18px 24px}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #e1e6ef;border-radius:14px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;padding:11px;border:1px solid #cbd3df;border-radius:9px;box-sizing:border-box}button{padding:11px 15px;border:0;border-radius:9px;background:#0b3d2e;color:white;font-weight:700;cursor:pointer}.secondary{background:#e9eef5;color:#172033}.hidden{display:none}.muted{color:#667085;font-size:13px}.error{color:#b42318;background:#fff0ef;padding:10px;border-radius:8px}.success{color:#067647;background:#ecfdf3;padding:10px;border-radius:8px}.risk{font-size:30px;font-weight:800}.finding{padding:12px;border-left:4px solid #d6a800;background:#fff9df;margin:8px 0;border-radius:6px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}</style>
</head>
<body><header><strong>SME Financial Health Diagnostic</strong></header><main>
<section id="auth" class="card"><h2>Sign in</h2><div class="grid"><div><label>Email</label><input id="email" type="email"></div><div><label>Password</label><input id="password" type="password"></div></div><p><button onclick="login()">Sign in</button> <button class="secondary" onclick="signup()">Create account</button></p><p id="authmsg"></p></section>
<section id="app" class="hidden"><div class="card"><h2>Clients</h2><button onclick="show('clientForm')">+ New client</button><div id="clients"></div></div>
<div id="clientForm" class="card hidden"><h2>New SME client</h2><div class="grid"><div><label>Business name</label><input id="business_name"></div><div><label>Owner name</label><input id="owner_name"></div><div><label>Contact</label><input id="contact"></div><div><label>Sector</label><input id="sector"></div></div><p><button onclick="createClient()">Create client</button></p></div>
<div id="assessment" class="card hidden"><h2>Financial assessment</h2><p id="assessmentMeta" class="muted"></p><div class="grid" id="inputs"></div><p><button onclick="saveInputs()">Save inputs</button> <button onclick="runDiagnostic()">Run diagnostic</button></p><p id="assessmentMsg"></p></div>
<div id="report" class="card hidden"><h2>Financial Health Report</h2><div id="reportBody"></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://adqyigwnotfvboblmlyr.supabase.co',KEY='sb_publishable_nSh-mNWE6erSAfRsS7-IHA_Zgjk-xmA',sb=supabase.createClient(URL,KEY);let aid=null;
const keys=[['revenue_growth','Revenue growth %'],['ebitda_margin','EBITDA margin %'],['current_ratio','Current ratio'],['dso_days','DSO days'],['inventory_days','Inventory days'],['cash_conversion_cycle_days','Cash conversion cycle days'],['debt_to_ebitda','Debt / EBITDA'],['interest_coverage','Interest coverage'],['dscr','DSCR'],['overdue_90_plus_pct','Overdue 90+ %'],['customer_concentration_pct','Customer concentration %']];document.getElementById('inputs').innerHTML=keys.map(x=>`<div><label>${x[1]}</label><input id="${x[0]}" type="number" step="any"></div>`).join('');
const show=x=>document.getElementById(x).classList.remove('hidden'),hide=x=>document.getElementById(x).classList.add('hidden');
async function login(){let{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return authmsg.textContent=error.message;start()}async function signup(){let{data,error}=await sb.auth.signUp({email:email.value,password:password.value});if(error)authmsg.textContent=error.message;else authmsg.textContent=data.session?'Account created':'Check email for confirmation'}async function start(){let{data}=await sb.auth.getSession();if(!data.session)return;hide('auth');show('app');loadClients()}
async function api(path,opt={}){let{data}=await sb.auth.getSession();if(!data.session)throw Error('Please sign in again');opt.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+data.session.access_token},opt.headers||{});let r=await fetch(URL+'/functions/v1/diagnostic-api'+path,opt),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function loadClients(){try{let j=await api('/clients');clients.innerHTML=j.clients.length?'<table><tr><th>Business</th><th>Sector</th><th>Action</th></tr>'+j.clients.map(c=>`<tr><td>${c.business_name}</td><td>${c.sector||''}</td><td><button onclick="newAssessment('${c.id}','${String(c.business_name).replaceAll("'","\\'")}')">Assess</button></td></tr>`).join('')+'</table>':'<p class="muted">No clients yet.</p>'}catch(e){clients.innerHTML='<p class="error">'+e.message+'</p>'}}
async function createClient(){try{let j=await api('/clients',{method:'POST',body:JSON.stringify({business_name:business_name.value,owner_name:owner_name.value,contact:contact.value,sector:sector.value})});hide('clientForm');await loadClients();newAssessment(j.client.id,j.client.business_name)}catch(e){alert(e.message)}}
async function newAssessment(id,name){try{let j=await api('/assessments',{method:'POST',body:JSON.stringify({client_id:id})});aid=j.assessment.id;assessmentMeta.textContent=name+' • Assessment '+aid;show('assessment');hide('report')}catch(e){alert(e.message)}}
function body(){let o={};keys.forEach(k=>{let v=document.getElementById(k[0]).value;if(v!=='')o[k[0]]=Number(v)});return o}async function saveInputs(){try{await api('/assessments/'+aid+'/inputs',{method:'PUT',body:JSON.stringify(body())});assessmentMsg.className='success';assessmentMsg.textContent='Financial inputs saved.'}catch(e){assessmentMsg.className='error';assessmentMsg.textContent=e.message}}
async function runDiagnostic(){try{await saveInputs();await api('/assessments/'+aid+'/run',{method:'POST'});let j=await api('/assessments/'+aid+'/report'),r=j.report;reportBody.innerHTML='<div class="grid"><div><small>Risk score</small><div class="risk">'+(r.risk_score??'—')+'</div></div><div><small>Risk level</small><div class="risk">'+(r.risk_level||'—')+'</div></div></div><h3>Findings</h3>'+((r.findings||[]).map(x=>'<div class="finding"><b>'+String(x.severity||'Finding')+'</b><br>'+String(x.title||x.name||x.description||JSON.stringify(x))+'</div>').join('')||'<p>No findings returned.</p>');show('report')}catch(e){assessmentMsg.className='error';assessmentMsg.textContent=e.message}}
start();</script></body></html>
