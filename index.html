<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SME Financial Health Diagnostic</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#0b3d2e;color:#fff;padding:18px 24px}header .bar{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #e1e6ef;border-radius:14px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;padding:11px;border:1px solid #cbd3df;border-radius:9px;box-sizing:border-box}input:focus{outline:2px solid #b7d7cc;border-color:#0b3d2e}button{padding:11px 15px;border:0;border-radius:9px;background:#0b3d2e;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#e9eef5;color:#172033}.hidden{display:none}.muted{color:#667085;font-size:13px}.error{color:#b42318;background:#fff0ef;padding:10px;border-radius:8px}.success{color:#067647;background:#ecfdf3;padding:10px;border-radius:8px}.risk{font-size:30px;font-weight:800}.finding{padding:12px;border-left:4px solid #d6a800;background:#fff9df;margin:8px 0;border-radius:6px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}th{font-size:12px;text-transform:uppercase;color:#667085}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.pill-HIGH{background:#fee4e2;color:#b42318}.pill-MEDIUM{background:#fff3d6;color:#9a6700}.pill-LOW{background:#ecfdf3;color:#067647}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}.summary div{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:14px}.metric-value{font-size:20px;font-weight:800;margin-top:4px}@media(max-width:700px){table{font-size:13px}.report-table{overflow:auto}}
</style>
</head>
<body>
<header><div class="bar"><strong>SME Financial Health Diagnostic</strong><button id="logoutBtn" class="secondary hidden">Sign out</button></div></header>
<main>
<section id="auth" class="card"><h2>Sign in</h2><div class="grid"><div><label>Email</label><input id="email" type="email" autocomplete="email"></div><div><label>Password</label><input id="password" type="password" autocomplete="current-password"></div></div><p><button id="signinBtn">Sign in</button> <button class="secondary" id="signupBtn">Create account</button></p><p id="authmsg"></p></section>
<section id="app" class="hidden">
<div class="card"><h2>Clients</h2><button id="newClientBtn">+ New client</button><div id="clients"></div></div>
<div id="clientForm" class="card hidden"><h2>New SME client</h2><div class="grid"><div><label>Business name</label><input id="business_name"></div><div><label>Owner name</label><input id="owner_name"></div><div><label>Contact</label><input id="contact"></div><div><label>Sector</label><input id="sector"></div></div><p><button id="createClientBtn">Create client</button></p></div>
<div id="assessment" class="card hidden"><h2>Financial assessment</h2><p id="assessmentMeta" class="muted"></p><div class="grid" id="inputs"></div><p><button id="saveBtn">Save inputs</button> <button id="runBtn">Run diagnostic</button></p><p id="assessmentMsg"></p></div>
<div id="report" class="card hidden"><h2>Financial Health Report</h2><div id="reportBody"></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://adqyigwnotfvboblmlyr.supabase.co';
const SUPABASE_KEY='sb_publishable_nSh-mNWE6erSAfRsS7-IHA_Zgjk-xmA';
const APP_URL='https://nehaghosh910-cmyk.github.io/sme-financial-diagnostic/';
const API_BASE=SUPABASE_URL+'/functions/v1/diagnostic-api-v2';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let aid=null;
const keys=[['revenue_growth','Revenue growth %'],['ebitda_margin','EBITDA margin %'],['current_ratio','Current ratio'],['dso_days','DSO days'],['inventory_days','Inventory days'],['cash_conversion_cycle_days','Cash conversion cycle days'],['debt_to_ebitda','Debt / EBITDA'],['interest_coverage','Interest coverage'],['dscr','DSCR'],['overdue_90_plus_pct','Overdue 90+ %'],['customer_concentration_pct','Customer concentration %']];
$('inputs').innerHTML=keys.map(x=>`<div><label>${x[1]}</label><input id="${x[0]}" type="number" step="any" required></div>`).join('');
function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function authMsg(text,cls='muted'){const x=$('authmsg');x.className=cls;x.textContent=text}function assessmentMsg(text,cls='muted'){const x=$('assessmentMsg');x.className=cls;x.textContent=text}
async function signup(){authMsg('Creating account…');const email=$('email').value.trim(),password=$('password').value;if(!email||!password){authMsg('Enter an email address and password.','error');return}try{const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:APP_URL}});if(error){authMsg(error.message,'error');return}if(data.session){authMsg('Account created. Signing you in…','success');await start()}else authMsg('Account created. Check your email for the confirmation link, then sign in.','success')}catch(e){authMsg(e?.message||String(e),'error')}}
async function login(){authMsg('Signing in…');const email=$('email').value.trim(),password=$('password').value;if(!email||!password){authMsg('Enter an email address and password.','error');return}try{const {error}=await sb.auth.signInWithPassword({email,password});if(error){authMsg(error.message,'error');return}await start()}catch(e){authMsg(e?.message||String(e),'error')}}
async function logout(){await sb.auth.signOut();hide('app');hide('logoutBtn');show('auth');authMsg('Signed out.','muted')}
async function start(){try{const {data}=await sb.auth.getSession();if(!data.session)return;hide('auth');show('app');show('logoutBtn');await loadClients()}catch(e){authMsg(e?.message||String(e),'error')}}
async function api(path,opt={}){const {data}=await sb.auth.getSession();if(!data.session)throw Error('Please sign in again');opt.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+data.session.access_token},opt.headers||{});const r=await fetch(API_BASE+path,opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Request failed ('+r.status+')');return j}
async function loadClients(){try{const j=await api('/clients');$('clients').innerHTML=j.clients.length?'<table><tr><th>Business</th><th>Sector</th><th>Action</th></tr>'+j.clients.map(c=>`<tr><td>${esc(c.business_name)}</td><td>${esc(c.sector||'')}</td><td><button onclick="newAssessment('${esc(c.id)}','${esc(c.business_name)}')">Assess</button></td></tr>`).join('')+'</table>':'<p class="muted">No clients yet.</p>'}catch(e){$('clients').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
async function createClient(){try{const j=await api('/clients',{method:'POST',body:JSON.stringify({business_name:$('business_name').value,owner_name:$('owner_name').value,contact:$('contact').value,sector:$('sector').value})});hide('clientForm');await loadClients();newAssessment(j.client.id,j.client.business_name)}catch(e){alert(e.message)}}
async function newAssessment(id,name){try{const j=await api('/assessments',{method:'POST',body:JSON.stringify({client_id:id})});aid=j.assessment.id;$('assessmentMeta').textContent=esc(name)+' • Assessment '+aid;keys.forEach(k=>$(k[0]).value='');assessmentMsg('Enter all 11 metrics, save them, then run the diagnostic.');show('assessment');hide('report');window.scrollTo({top:$('assessment').offsetTop-20,behavior:'smooth'})}catch(e){alert(e.message)}}
function body(){const o={};keys.forEach(k=>{const v=$(k[0]).value.trim();if(v!=='')o[k[0]]=Number(v)});return o}
function validateInputs(){const o=body();const missing=keys.filter(k=>!Object.prototype.hasOwnProperty.call(o,k[0])||!Number.isFinite(o[k[0]])).map(k=>k[1]);if(missing.length){assessmentMsg('Complete all 11 metrics before running the diagnostic: '+missing.join(', '),'error');return false}return true}
async function saveInputs(showMessage=true){if(!validateInputs())throw Error('Incomplete financial inputs');try{await api('/assessments/'+aid+'/inputs',{method:'PUT',body:JSON.stringify(body())});if(showMessage)assessmentMsg('Financial inputs saved.','success');return true}catch(e){assessmentMsg(e.message,'error');throw e}}
function renderReport(r){const findings=Array.isArray(r.findings)?r.findings:[];const rows=findings.map(x=>`<tr><td>${esc(x.metric)}</td><td>${esc(x.value)}</td><td><span class="pill pill-${esc(x.severity)}">${esc(x.severity)}</span></td><td>${esc(x.finding)}</td><td>${esc(x.score)}</td></tr>`).join('');$('reportBody').innerHTML=`<p class="muted">Engine ${esc(r.engine_version||'—')} • Generated ${esc(r.diagnostic_created_at||'—')}</p><div class="summary"><div><small>Risk score</small><div class="metric-value">${esc(r.risk_score??'—')}</div></div><div><small>Risk level</small><div class="metric-value">${esc(r.risk_level||'—')}</div></div><div><small>Findings</small><div class="metric-value">${esc(r.finding_count??findings.length)}</div></div><div><small>High</small><div class="metric-value">${esc(r.high_findings??'0')}</div></div><div><small>Medium</small><div class="metric-value">${esc(r.medium_findings??'0')}</div></div><div><small>Low</small><div class="metric-value">${esc(r.low_findings??'0')}</div></div></div><h3>Diagnostic findings</h3><div class="report-table"><table><tr><th>Metric</th><th>Value</th><th>Severity</th><th>Finding</th><th>Score</th></tr>${rows||'<tr><td colspan="5">No findings returned.</td></tr>'}</table></div>`;show('report')}
async function runDiagnostic(){try{await saveInputs(false);assessmentMsg('Running diagnostic engine…','muted');$('runBtn').disabled=true;const j=await api('/assessments/'+aid+'/run',{method:'POST'});if(j.result)assessmentMsg('Diagnostic completed successfully.','success');const report=await api('/assessments/'+aid+'/report');renderReport(report.report)}catch(e){assessmentMsg(e.message,'error')}finally{$('runBtn').disabled=false}}
$('signinBtn').addEventListener('click',login);$('signupBtn').addEventListener('click',signup);$('logoutBtn').addEventListener('click',logout);$('newClientBtn').addEventListener('click',()=>show('clientForm'));$('createClientBtn').addEventListener('click',createClient);$('saveBtn').addEventListener('click',()=>saveInputs(true).catch(()=>{}));$('runBtn').addEventListener('click',runDiagnostic);start();
</script>
</body></html>
