<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SME Finance Operations</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#0b3d2e;color:white;padding:18px 24px}main{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #e1e6ef;border-radius:14px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #cbd3df;border-radius:9px;box-sizing:border-box}button{padding:11px 15px;border:0;border-radius:9px;background:#0b3d2e;color:white;font-weight:700;cursor:pointer}.error{color:#b42318;background:#fff0ef;padding:10px;border-radius:8px}.success{color:#067647;background:#ecfdf3;padding:10px;border-radius:8px}.muted{color:#667085}.hidden{display:none}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.summary div{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:14px}.metric{font-size:22px;font-weight:800;margin-top:4px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee}</style></head><body><header><strong>SME Finance Operations</strong></header><main><section id="auth" class="card"><h2>Sign in</h2><div class="grid"><div><label>Email</label><input id="email" type="email" autocomplete="email"></div><div><label>Password</label><input id="password" type="password" autocomplete="current-password"></div></div><p><button id="signin" type="button">Sign in</button></p><div id="authmsg" class="muted">Use the same account you used for the diagnostic application.</div></section><section id="app" class="hidden"><div class="card"><h2>Operational workspace</h2><p>Signed in as <strong id="user"></strong></p><label>SME client</label><select id="client"></select></div><div class="card"><h2>Financial control dashboard</h2><div id="dashboard" class="summary"></div></div><div class="card"><h2>Connection test</h2><p id="status">Loading…</p><p><button type="button" id="refresh">Refresh</button> <button type="button" id="signout">Sign out</button></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://adqyigwnotfvboblmlyr.supabase.co',KEY='sb_publishable_nSh-mNWE6erSAfRsS7-IHA_Zgjk-xmA',API=URL+'/functions/v1/diagnostic-api-v2';const sb=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);function authmsg(t,c='muted'){$('authmsg').className=c;$('authmsg').textContent=t}async function api(path){const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data.session)throw Error('No active Supabase session.');const r=await fetch(API+path,{headers:{Authorization:'Bearer '+data.session.access_token,apikey:KEY}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'API request failed ('+r.status+')');return j}async function signin(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){authmsg('Enter email and password.','error');return}try{$('signin').disabled=true;authmsg('Signing in…');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session)throw Error('No session returned. Confirm your email address in Supabase Auth.');await start()}catch(e){console.error(e);authmsg(e.message||'Sign-in failed.','error')}finally{$('signin').disabled=false}}async function start(){try{const {data,error}=await sb.auth.getUser();if(error)throw error;$('user').textContent=data.user.email;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){authmsg(e.message,'error')}}async function load(){try{const j=await api('/clients');const clients=j.clients||[];$('client').innerHTML=clients.map(c=>'<option value="'+c.id+'">'+c.business_name+' — '+(c.sector||'General')+'</option>').join('');if(!clients.length){$('status').textContent='Authentication works, but no SME client is assigned to this account.';return}const id=clients[0].id;const d=await api('/dashboard?client_id='+encodeURIComponent(id));const a=d.ar||{},p=d.ap||{},c=d.cashflow||{};$('dashboard').innerHTML='<div><small>AR outstanding</small><div class="metric">₹'+Number(a.outstanding||0).toLocaleString('en-IN')+'</div></div><div><small>AP outstanding</small><div class="metric">₹'+Number(p.outstanding||0).toLocaleString('en-IN')+'</div></div><div><small>Receipts</small><div class="metric">₹'+Number(c.receipts||0).toLocaleString('en-IN')+'</div></div><div><small>Payments</small><div class="metric">₹'+Number(c.payments||0).toLocaleString('en-IN')+'</div></div>';$('status').className='success';$('status').textContent='Authentication and diagnostic API connection are working.'}catch(e){console.error(e);$('status').className='error';$('status').textContent=e.message}}$('signin').addEventListener('click',signin);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')signin()});$('refresh').addEventListener('click',load);$('signout').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});sb.auth.getSession().then(x=>{if(x.data.session)start()});</script></body></html>
